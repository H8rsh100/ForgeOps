apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker-service-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/H8rsh100/ForgeOps.git
    targetRevision: HEAD
    path: charts/worker-service
    helm:
      valueFiles:
        - ../../gitops/prod/worker-service-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: forgeops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
