apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgeops-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/H8rsh100/ForgeOps.git
    targetRevision: HEAD
    path: gitops/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
