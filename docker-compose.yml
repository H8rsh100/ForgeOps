services:
  api-service:
    build:
      context: ./services/api-service
      dockerfile: Dockerfile
    container_name: forgeops-api-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 3

  worker-service:
    build:
      context: ./services/worker-service
      dockerfile: Dockerfile
    container_name: forgeops-worker-service
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=dev
      - API_SERVICE_URL=http://api-service:8000
      - POLL_INTERVAL=3.0
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 3
