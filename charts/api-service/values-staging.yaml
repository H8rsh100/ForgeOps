replicaCount: 2

image:
  tag: "staging-latest"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: true
  hosts:
    - host: api.staging.forgeops.internal
      paths:
        - path: /
          pathType: Prefix
