name: ForgeOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            services/api-service/requirements.txt
            services/worker-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r services/api-service/requirements.txt
          pip install -r services/worker-service/requirements.txt

      - name: Python Syntax & Lint Check
        run: |
          flake8 services/api-service/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services/worker-service/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest for api-service
        run: |
          cd services/api-service
          pytest -v

  helm-lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Lint api-service Helm Chart
        run: helm lint charts/api-service

      - name: Lint worker-service Helm Chart
        run: helm lint charts/worker-service

  terraform-lint:
    name: Validate Terraform Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init & Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
