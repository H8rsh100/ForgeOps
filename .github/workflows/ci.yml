name: ForgeOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/forgeops

jobs:
  lint-and-test:
    name: Lint & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            services/api-service/requirements.txt
            services/worker-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r services/api-service/requirements.txt
          pip install -r services/worker-service/requirements.txt

      - name: Python Syntax & Lint Check
        run: |
          flake8 services/api-service/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 services/worker-service/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest for api-service
        run: |
          cd services/api-service
          pytest -v

  helm-lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Lint api-service Helm Chart
        run: helm lint charts/api-service

      - name: Lint worker-service Helm Chart
        run: helm lint charts/worker-service

  terraform-lint:
    name: Validate Terraform Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init & Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate

  docker-build-scan:
    name: Build, Scan & Push Docker Images
    needs: [lint-and-test, helm-lint, terraform-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local api-service image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-service
          file: ./services/api-service/Dockerfile
          load: true
          tags: api-service:test

      - name: Run Trivy Vulnerability Scan (api-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-service:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build local worker-service image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker-service
          file: ./services/worker-service/Dockerfile
          load: true
          tags: worker-service:test

      - name: Run Trivy Vulnerability Scan (worker-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'worker-service:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push api-service image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-service
          file: ./services/api-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api-service:latest

      - name: Push worker-service image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker-service
          file: ./services/worker-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-worker-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-worker-service:latest
